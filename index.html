<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#1E2A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xcaret Map">
<title>Xcaret Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/arte.css">
</head>
<body>
<div id="map" aria-label="Map"></div>

<!-- Top card -->
<div id="topcard" class="card">
  <div class="row1">
    <div class="titlewrap">
      <img id="arteLogo" src="icons/arte-wordmark.png" alt="" width="104" height="37">
      <h1 id="areaTitle">Hotel Xcaret Arte</h1>
      <div id="offline" class="offline" title="Offline status"><span class="dot"></span><span id="offlineText">Checking…</span></div>
    </div>
    <button id="mapMenu" type="button" aria-expanded="false" aria-controls="switcher chips">Map options</button>
    <button id="themeBtn" class="iconbtn" aria-label="Theme" title="Light / Dark / Sun">◐</button>
  </div>

  <div class="switcher" id="switcher" role="tablist"></div>

  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search places…" autocomplete="off" enterkeyhint="search" aria-label="Search places">
    <button id="searchClear" class="searchclear" aria-label="Clear search" hidden>×</button>
  </div>

  <div id="placeMatches" aria-label="Matching places" hidden></div>
  <div class="chips" id="chips"></div>
</div>

<div class="arte-tools">
  <div id="arteKey" hidden>
    <div class="arte-symbols"><span><i></i>Lagoon</span><span><i class="walk"></i>Footpath</span>
    <span><i class="steps"></i>Steps</span><span><i class="possible"></i>Unconfirmed crossing</span>
    <span><i class="service"></i>Service road</span></div>
    <button type="button" id="arteGuides">Walks from my Casa</button>
    <label id="arteSavedLabel" hidden>Saved walk <select id="arteSaved"></select></label>
    <input id="gpxFile" type="file" accept=".gpx,application/gpx+xml" hidden>
    <button type="button" id="arteImport">Import GPX</button>
    <button type="button" id="arteRecord">Record my walk</button>
    <button type="button" id="arteExport" hidden>Download GPX</button>
    <button type="button" id="arteForget" hidden>Clear saved walk</button>
    <small id="arteWalkStatus" role="status"></small>
  </div>
  <div class="arte-dock"><button id="quickWalks" type="button">Walks</button><button id="artePaths" type="button" aria-controls="arteKey" aria-pressed="false">Path view</button></div>
</div>
<dialog id="arteGuide" aria-labelledby="guideTitle">
  <form method="dialog"><h2 id="guideTitle">Walks from my Casa</h2><button aria-label="Close walks">×</button></form>
  <label>Your Casa<select id="guideCasa"><option value="musica">Casa de la Música</option><option value="piramide">Casa de la Pirámide</option></select></label>
  <label>Walk to<select id="guidePlace"></select></label>
  <p id="guideEvidence"></p><ol id="guideSteps"></ol>
  <div><button id="guideReverse" type="button">Show return walk</button></div>
</dialog>
<!-- Locate button -->
<button id="locateBtn" class="fab" aria-label="Show my location" title="My location">◎</button>

<!-- Bottom sheet -->
<div id="sheet" class="sheet" aria-hidden="true" inert>
  <button id="closePlace" type="button" aria-label="Close place details">×</button>
  <div class="grabber" id="grabber"></div>
  <div class="sheetbody" id="sheetbody"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/arte-walk.js"></script>
<script src="js/arte.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW reg failed', e));
  });
}
</script>
</body>
</html>
